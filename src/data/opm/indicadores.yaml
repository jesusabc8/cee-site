# Indicadores do OPM (especificação v1.1, seção 5). Fonte única das fichas; fórmulas em LaTeX, convertidas em MathML
# no build (temml), sem JavaScript no navegador. `estado`: publicado | em-construcao (com `pendencia`); camada 3 publicada = experimental.
- codigo: I.1
  modulo: a2-2-juro-real
  camada: 1
  estado: publicado
  nome: { pt: 'Juro real ex ante em 12 meses', en: '12-month ex ante real rate' }
  formula: '\begin{aligned} r^{ea}_t &= 100\left[\frac{1+i^{e}_{t,t+12}/100}{1+\pi^{e}_{t,t+12}/100}-1\right]\\ 1+\frac{i^{e}_{t,t+12}}{100} &= \prod_{d=1}^{252}\left(1+\frac{i_{k(d)}}{100}\right)^{1/252} \end{aligned}'
  descricao:
    pt: Selic esperada nos próximos 252 dias úteis, composta com a mediana Focus de cada reunião do Copom (cada meta vigora até a reunião seguinte), deflacionada pela mediana Focus do IPCA para 12 meses (série suavizada), pela equação de Fisher exata.
    en: Expected Selic over the next 252 business days, compounded with the Focus median for each Copom meeting (each target holds until the next meeting), deflated by the Focus median for 12-month IPCA (smoothed series), using the exact Fisher equation.
  convencao:
    pt: O BCB usa médias trimestrais e quatro trimestres à frente (RPM set./2026, p. 80); os níveis não são diretamente comparáveis. Compõe-se a meta Selic esperada; a Selic efetiva fica cerca de 0,10 p.p. abaixo.
    en: The BCB uses quarterly averages four quarters ahead (MPR Sep/2026, p. 80); levels are not directly comparable. The expected Selic target is compounded; the effective rate is about 0.10 p.p. lower.
  arquivo: indicadores/i1_juro_real_ex_ante.csv
- codigo: I.2
  modulo: a2-2-juro-real
  camada: 1
  estado: publicado
  nome: { pt: 'Juro real ex post em 12 meses', en: '12-month ex post real rate' }
  formula: 'r^{ep}_t = 100\left[\frac{\prod_{d=t-251}^{t}(1+i^{ef}_d/100)^{1/252}}{1+\pi_{t-11,t}/100}-1\right]'
  descricao:
    pt: Selic efetiva (SGS 1178) composta nos últimos 252 dias úteis, deflacionada pelo IPCA acumulado em 12 meses.
    en: Effective Selic (SGS 1178) compounded over the last 252 business days, deflated by 12-month IPCA inflation.
  arquivo: indicadores/i2_juro_real_ex_post.csv
- codigo: I.3
  modulo: a2-2-juro-real
  camada: 1
  estado: publicado
  nome: { pt: 'Hiato de juros', en: 'Interest-rate gap' }
  formula: 'h^{r}_t = r^{ea}_t - r^{*}_t,\quad r^{*}_t \in [Q_1, Q_3]'
  descricao:
    pt: Juro real ex ante menos a faixa de juro neutro (mediana e quartis). A política é inequivocamente restritiva só quando o juro real supera o terceiro quartil da faixa.
    en: Ex ante real rate minus the neutral-rate band (median and quartiles). Policy is unambiguously restrictive only when the real rate exceeds the band's third quartile.
  arquivo: indicadores/i3_hiato_juros.csv
- codigo: I.4
  modulo: a2-2-juro-real
  camada: 1
  estado: publicado
  nome: { pt: 'Faixa de juro neutro', en: 'Neutral-rate band' }
  formula: 'r^{*}_t = \{Q_1,\ \mathrm{mediana},\ Q_3\}\ \text{de}\ \{r^{*,a}_t,\ r^{*,b\text{-}HP}_t,\ r^{*,b\text{-}H}_t,\ \dots\}'
  descricao:
    pt: "Distribuição de estimativas por métodos independentes. Camada 1: (a) juro real esperado para t+4 pela Focus anual; (b) tendência do juro real ex ante por HP unilateral (λ = 14.400) e por Hamilton (2018; h = 24, p = 12), ambos em tempo real. Camada 2: (c) juro real da NTN-B de 10 anos (curva NSS) menos um prêmio a termo aproximado pela diferença entre a NTN-B de 4 anos e o juro real Focus no mesmo horizonte. Camada 3: (d) TIPS de 5 anos, sem prêmio de risco soberano (sem medida aberta; ADR-024), mostrado à parte e fora da faixa; (e) modelo semiestrutural, que só entra na faixa se passar no critério de identificação (inclinação da IS com t ≤ −2). O valor do BCB aparece ao lado, nunca dentro da distribuição."
    en: "Distribution of estimates from independent methods. Layer 1: (a) expected real rate for t+4 from the annual Focus; (b) trend of the ex ante real rate by one-sided HP (λ = 14,400) and by Hamilton (2018; h = 24, p = 12), both in real time. Layer 2: (c) 10-year NTN-B real yield (NSS curve) minus a term premium approximated by the gap between the 4-year NTN-B and the Focus real rate over the same horizon. Layer 3: (d) 5-year TIPS, without sovereign risk premium (no open measure; ADR-024), shown apart and outside the band; (e) semi-structural model, which only enters the band if it passes the identification test (IS slope with t ≤ −2). The BCB value is shown beside, never inside, the distribution."
  convencao:
    pt: Com poucos métodos, os quartis são interpolações entre estimativas; a faixa é indicativa.
    en: With few methods, the quartiles are interpolations between estimates; the band is indicative.
  arquivo: indicadores/i4_faixa_neutro.csv
- codigo: I.5
  modulo: a2-1-copom
  camada: 1
  estado: publicado
  nome: { pt: 'Surpresa de política monetária', en: 'Monetary policy surprise' }
  formula: 'S_k = i_k - \tilde{\imath}_k,\qquad S^{n}_k = S_k/\sigma_k'
  descricao:
    pt: Meta decidida na reunião k menos a mediana Focus para essa reunião na última coleta anterior a ela; também contra o Top 5 (ranking de curto prazo) e normalizada pelo desvio-padrão das respostas. A medida de mercado (DI de um mês, Kuttner, 2001) exige dados da B3 e fica fora (ADR-024).
    en: Target decided at meeting k minus the Focus median for that meeting in the last survey before it; also against the Top 5 (short-term ranking) and normalised by the standard deviation of responses. The market measure (one-month DI, Kuttner, 2001) needs B3 data and is excluded (ADR-024).
  arquivo: indicadores/i5_surpresa.csv
- codigo: I.6
  modulo: a2-2-juro-real
  camada: 2
  estado: publicado
  nome: { pt: 'Envelope de regras de Taylor', en: 'Taylor-rule envelope' }
  formula: 'i^{T1}_t = r^{*} + \pi_t + 0{,}5(\pi_t-\pi^{*}) + 0{,}5\,h_t'
  descricao:
    pt: 'T1 (Taylor, 1993, inflação corrente), T2 (prospectiva, Focus 12 meses) e T3 (inercial; θ e φ estimados por MQO em 2012–2019, amostra declarada, com φ = b/(1−θ) muito impreciso porque θ ≈ 1), cada uma calculada para os quartis da faixa de juro neutro e para o mínimo e o máximo do hiato (IBC-Br). O envelope é o mínimo e o máximo do conjunto. Referências descritivas, sensíveis a r* e a h, nunca prescrição.'
    en: 'T1 (Taylor, 1993, current inflation), T2 (forward-looking, Focus 12 months) and T3 (inertial; θ and φ estimated by OLS over 2012–2019, a declared sample, with φ = b/(1−θ) very imprecise because θ ≈ 1), each computed for the quartiles of the neutral-rate band and the minimum and maximum of the gap (IBC-Br). The envelope is the minimum and maximum of the set. Descriptive references, sensitive to r* and h, never prescriptions.'
  arquivo: indicadores/i6_taylor.csv
- codigo: I.7
  modulo: a2-4-expectativas
  camada: 1
  estado: publicado
  nome: { pt: 'Índice de credibilidade', en: 'Credibility index' }
  formula: 'IC_t=\begin{cases}1, & \pi^{e}_t=\pi^{*}\\ 1-\dfrac{|\pi^{e}_t-\pi^{*}|}{\delta}, & 0<|\pi^{e}_t-\pi^{*}|<\delta\\ 0, & |\pi^{e}_t-\pi^{*}|\ge\delta\end{cases}\qquad \delta=1{,}5'
  descricao:
    pt: Cecchetti e Krause (2002), adaptado por de Mendonça (2007), em três horizontes da Focus (12 meses, ano t+1 e ano t+3). O horizonte longo é o mais informativo sobre ancoragem.
    en: Cecchetti and Krause (2002), as adapted by de Mendonça (2007), at three Focus horizons (12 months, year t+1 and year t+3). The long horizon is the most informative about anchoring.
  convencao:
    pt: A meta de t+3 é a afinal fixada para o ano, não a conhecida na data da coleta.
    en: The t+3 target is the one eventually set for that year, not the one known at the survey date.
  arquivo: indicadores/i7_i8_credibilidade_desancoragem.csv
- codigo: I.8
  modulo: a2-4-expectativas
  camada: 1
  estado: publicado
  nome: { pt: 'Desancoragem e dispersão das expectativas', en: 'De-anchoring and dispersion of expectations' }
  formula: 'D_t = \pi^{e}_{t,T+3} - \pi^{*},\qquad CV_t = \sigma_t/\pi^{e}_t'
  descricao:
    pt: Distância da mediana Focus para t+3 à meta e dispersão das respostas (desvio-padrão e coeficiente de variação).
    en: Distance of the Focus median for t+3 from the target, and dispersion of responses (standard deviation and coefficient of variation).
  arquivo: indicadores/i7_i8_credibilidade_desancoragem.csv
- codigo: I.9
  modulo: a2-3-inflacao
  camada: 2
  estado: publicado
  nome: { pt: 'IPCA e núcleos dessazonalizados, anualizados', en: 'Seasonally adjusted, annualised IPCA and core measures' }
  formula: 'x^{SAAR}_t = 100\left[\prod_{j=0}^{2}\left(1+\frac{x^{sa}_{t-j}}{100}\right)^{4}-1\right]'
  descricao:
    pt: 'Variação de três meses anualizada sobre as séries dessazonalizadas pelo CEE com X-13 (ADR-023): IPCA, grupos, EX3 serviços e industriais e média dos núcleos (média mensal dos cinco núcleos ajustados). Validada contra o RPM de set./2026 (±0,5 p.p.).'
    en: 'Annualised three-month change on the series seasonally adjusted by CEE with X-13 (ADR-023): IPCA, groups, EX3 services and goods and the core average (monthly mean of the five adjusted cores). Validated against the Sep/2026 MPR (±0.5 p.p.).'
  arquivo: indicadores/i9_saar.csv
- codigo: I.10
  modulo: a2-3-inflacao
  camada: 1
  estado: publicado
  nome: { pt: 'Contador do regime de meta contínua', en: 'Continuous-target regime counter' }
  formula: 'C_t = \begin{cases} C_{t-1}+1, & \pi_{t-11,t}\notin[\pi^{*}-1{,}5;\ \pi^{*}+1{,}5]\ \text{(mesmo lado)}\\ 0, & \text{caso contrário}\end{cases}'
  descricao:
    pt: Meses consecutivos com o IPCA em 12 meses fora do intervalo de tolerância (1,5 % a 4,5 %). A meta é considerada descumprida após seis meses consecutivos, o que obriga nota e carta públicas do BCB (Decreto nº 12.079/2024, conforme BCB, "Meta para a inflação", e RPM set./2026, p. 3).
    en: Consecutive months with 12-month IPCA outside the tolerance band (1.5% to 4.5%). The target is deemed missed after six consecutive months, which requires a public note and letter from the BCB (Decree 12,079/2024, as stated by the BCB, "Inflation target", and MPR Sep/2026, p. 3).
  arquivo: indicadores/i10_regime_meta_continua.csv
- codigo: I.11
  modulo: a2-3-inflacao
  camada: 2
  estado: publicado
  nome: { pt: 'Fração dos subitens acima do teto da meta', en: 'Share of sub-items above the target ceiling' }
  formula: 'F_t = \sum_{j} w_{j,t}\,\mathbf{1}\{x^{SAAR}_{j,t} > 4{,}5\}'
  descricao:
    pt: 'Parcela, ponderada pelos pesos do IPCA (SIDRA 7060), dos subitens com variação dessazonalizada anualizada acima de 4,5 %. Cada subitem é ajustado com X-13 (airline); subitens em que o ajuste falha ficam fora e o peso coberto é publicado ao lado.'
    en: 'IPCA-weighted share (SIDRA 7060) of sub-items with seasonally adjusted annualised change above 4.5%. Each sub-item is adjusted with X-13 (airline); sub-items where the adjustment fails are excluded and the weight covered is published alongside.'
  arquivo: indicadores/i11_subitens_acima_teto.csv
- codigo: I.12
  modulo: a2-4-expectativas
  camada: 2
  estado: publicado
  nome: { pt: 'Inflação implícita', en: 'Breakeven inflation' }
  formula: '\pi^{BE}_n = \frac{1+y^{pre}_n}{1+y^{real}_n}-1'
  descricao:
    pt: 'Longo prazo (2, 3 e 5 anos): curvas Nelson-Siegel(-Svensson) ajustadas às taxas dos títulos sem cupom do Tesouro Direto (LTN e NTN-B Principal; taxa de compra, que inclui o spread do Tesouro Direto). Contém prêmios de risco inflacionário e de liquidez: é "inflação implícita", nunca "expectativa do mercado". O curto prazo (Araujo e Vicente, 2017) segue em construção.'
    en: 'Long end (2, 3 and 5 years): Nelson-Siegel(-Svensson) curves fitted to zero-coupon Tesouro Direto rates (LTN and NTN-B Principal; purchase rate, which includes the Tesouro Direto spread). It contains inflation-risk and liquidity premia: it is "breakeven inflation", never "market expectation". The short end (Araujo and Vicente, 2017) is still under construction.'
  arquivo: indicadores/i12_inflacao_implicita.csv
- codigo: I.13
  modulo: a2-5-transmissao
  camada: 2
  estado: publicado
  nome: { pt: 'Repasse da Selic ao custo do crédito', en: 'Pass-through of the Selic to lending rates' }
  formula: '\Delta_h \ell_{t+h} = \alpha_h + \beta_h\,\Delta i_t + \Gamma_h^{\prime} X_t + u_{t+h},\quad h=1,\dots,12'
  descricao:
    pt: 'Projeções locais (Jordà, 2005), mensais, h = 1…12, com três defasagens de Δℓ e Δi como controles e erros de Newey-West; ℓ = taxa média total, PJ e PF livres. β_h é o repasse acumulado (p.p. por p.p. de Selic). Associações condicionais, não efeitos causais identificados.'
    en: 'Monthly local projections (Jordà, 2005), h = 1…12, with three lags of Δℓ and Δi as controls and Newey-West errors; ℓ = average rate, total, firms and households (non-earmarked). β_h is the cumulative pass-through (p.p. per p.p. of Selic). Conditional associations, not identified causal effects.'
  arquivo: indicadores/i13_repasse_lp.csv
- codigo: I.14
  modulo: a2-1-copom
  camada: 3
  estado: em-construcao
  nome: { pt: 'Índice de tom das comunicações do Copom', en: 'Copom communication tone index' }
  formula: 'T_k = \frac{N^{hawk}_k - N^{dove}_k}{N^{hawk}_k + N^{dove}_k}'
  descricao:
    pt: Léxico aplicado aos comunicados e atas, validado por dupla codificação humana (kappa de Cohen). Não é publicado sem validação.
    en: Lexicon applied to statements and minutes, validated by double human coding (Cohen's kappa). Not published without validation.
  pendencia:
    pt: 'Léxico preliminar e amostra de 210 frases prontos; falta a dupla codificação humana (kappa de Cohen ≥ 0,6) e a revisão do Comitê Editorial. Sem validação, o índice não é publicado.'
    en: 'Preliminary lexicon and a 210-sentence sample are ready; double human coding (Cohen kappa ≥ 0.6) and Editorial Committee review are pending. Without validation, the index is not published.'

- codigo: I.15
  modulo: a2-5-transmissao
  camada: 2
  estado: publicado
  nome: { pt: 'Hiato do produto multimétodo', en: 'Multi-method output gap' }
  formula: 'h_t \in \{h^{HP\text{-}unilateral}_t,\ h^{Hamilton}_t,\ h^{UC}_t\}'
  descricao:
    pt: 'Faixa entre o HP unilateral (λ = 1.600) e o filtro de Hamilton (h = 8, p = 4) sobre o PIB trimestral dessazonalizado (SIDRA 1621), em tempo real; versão mensal com o IBC-Br no CSV. Componentes não observados com curva de Phillips entram na camada 3. O hiato do BCB aparece como referência ao lado.'
    en: 'Band between one-sided HP (λ = 1,600) and the Hamilton filter (h = 8, p = 4) on seasonally adjusted quarterly GDP (SIDRA 1621), in real time; monthly version with the IBC-Br in the CSV. Unobserved components with a Phillips curve come in layer 3. The BCB gap is shown beside as a reference.'
  arquivo: indicadores/i15_hiato_produto_trimestral.csv
- codigo: I.16
  modulo: a2-5-transmissao
  camada: 3
  estado: publicado
  nome: { pt: 'Prêmio a termo da curva prefixada', en: 'Term premium on the nominal curve' }
  formula: 'TP_{t}^{(n)} = y_t^{(n)} - \frac{1}{n}\sum_{j=0}^{n-1}\mathbb{E}_t\, y_{t+j}^{(1)}'
  descricao:
    pt: 'Adrian, Crump e Moench (2013) sobre a curva nominal NSS do Tesouro Direto (1 a 36 meses), com três fatores e VAR(1). Experimental: amostra curta e prazo máximo de 3 anos; o VAR projeta trajetória de juros diferente da Focus, o que pode tornar o prêmio negativo — limitação de amostra pequena conhecida.'
    en: 'Adrian, Crump and Moench (2013) on the Tesouro Direto nominal NSS curve (1 to 36 months), with three factors and a VAR(1). Experimental: short sample and 3-year maximum maturity; the VAR projects a rate path different from Focus, which can make the premium negative — a known small-sample limitation.'
  arquivo: indicadores/i16_premio_termo_acm.csv

- codigo: I.17
  modulo: a2-5-transmissao
  camada: 3
  estado: publicado
  nome: { pt: 'Índice de condições financeiras', en: 'Financial conditions index' }
  formula: 'ICF_t = \sum_{j} \lambda_{1j}\, z_{j,t}'
  descricao:
    pt: 'Primeiro componente principal de sete variáveis padronizadas de fontes abertas (spread e custo do crédito, juro real ex ante, inclinação da curva, câmbio real, dólar global, Treasury de 10 anos); maior = mais apertado. Experimental: PCA na amostra inteira, não em tempo real.'
    en: 'First principal component of seven standardised open-source variables (credit spread and cost, ex ante real rate, curve slope, real exchange rate, global dollar, 10-year Treasury); higher = tighter. Experimental: full-sample PCA, not real time.'
  arquivo: indicadores/i17_condicoes_financeiras.csv

- codigo: I.18
  modulo: a2-8-moeda
  camada: 1
  estado: publicado
  nome: { pt: 'Crescimento nominal e real dos agregados', en: 'Nominal and real growth of aggregates' }
  formula: 'g^{M}_t = 100\left(\frac{M_t}{M_{t-12}}-1\right),\qquad g^{M,real}_t = 100\left[\frac{1+g^{M}_t/100}{1+\pi_{t-11,t}/100}-1\right]'
  descricao:
    pt: Base restrita e M1 a M4 ("Novo"), em 12 meses e deflacionados pelo IPCA; variação mensal sobre a série dessazonalizada pelo CEE. Variações de M1 refletem sobretudo demanda por moeda (juros, Pix) e não são, por si, sinal de política frouxa.
    en: Narrow base and M1 to M4 ("New"), over 12 months and deflated by the IPCA; monthly change on the series seasonally adjusted by CEE. Changes in M1 mainly reflect money demand (interest rates, Pix) and are not, by themselves, a sign of loose policy.
  arquivo: indicadores/i18_agregados.csv
- codigo: I.19
  modulo: a2-8-moeda
  camada: 1
  estado: publicado
  nome: { pt: 'Multiplicador e coeficientes de comportamento', en: 'Multiplier and behavioural ratios' }
  formula: 'm = \frac{M1}{B},\qquad c = \frac{PMPP}{DV},\qquad r = \frac{R}{DV}'
  descricao:
    pt: Multiplicador de M1 sobre a base restrita; papel-moeda em poder do público e reservas bancárias em relação aos depósitos à vista.
    en: M1 multiplier on the narrow base; currency held by the public and bank reserves relative to demand deposits.
  arquivo: indicadores/i19_multiplicador_coeficientes.csv
- codigo: I.20
  modulo: a2-8-moeda
  camada: 1
  estado: publicado
  nome: { pt: 'Velocidade-renda e grau de monetização', en: 'Income velocity and monetisation' }
  formula: 'V_t = \frac{PIB^{nominal}_{12m}}{\overline{M}_t},\qquad \frac{\overline{M}_t}{PIB^{nominal}_{12m}}'
  descricao:
    pt: Para M1 e M2, com o PIB nominal acumulado em 12 meses (SGS 4382, em reais) e a média dos saldos dos últimos 12 meses.
    en: For M1 and M2, using 12-month nominal GDP (SGS 4382, in reais) and the average of the last 12 month-end balances.
  arquivo: indicadores/i20_velocidade_monetizacao.csv
- codigo: I.21
  modulo: a2-8-moeda
  camada: 2
  estado: em-construcao
  nome: { pt: 'Alíquota efetiva dos compulsórios', en: 'Effective reserve-requirement rate' }
  formula: 'a_t = \frac{\text{Recolhimentos}_t}{\text{Base de depósitos}_t}'
  descricao:
    pt: Recolhimentos compulsórios sobre a base de depósitos correspondente; séries mensais por modalidade ainda a enumerar.
    en: Reserve requirements over the corresponding deposit base; monthly series by type still to be enumerated.
  pendencia:
    pt: 'Recolhimentos e bases de depósitos por modalidade ainda não enumerados em séries mensais verificadas; o conjunto aberto do BCB traz só as alíquotas legais (docs/PENDIENTES.md).'
    en: 'Reserve collections and deposit bases by type not yet enumerated as verified monthly series; the BCB open dataset only carries statutory rates (docs/PENDIENTES.md).'
# Complementares do CEE ao módulo A2.3 (ADR-030): fora da contagem de 21 da especificação.
- codigo: C.1
  complementar: true
  modulo: a2-3-inflacao
  camada: 1
  estado: publicado
  nome: { pt: 'Dispersão regional da inflação', en: 'Regional dispersion of inflation' }
  formula: '\sigma_t=\sqrt{\frac{\sum_a w_a\,(\pi^{12}_{a,t}-\bar\pi^{12}_{t})^2}{\sum_a w_a}},\qquad IIQ_t=Q^{w}_{0{,}75}-Q^{w}_{0{,}25}'
  descricao:
    pt: 'Desvio-padrão e intervalo interquartil da inflação em 12 meses das 16 áreas do IPCA, ponderados pelos pesos regionais oficiais (IBGE, POF 2017–2018). Quantil ponderado: menor valor cujo peso acumulado atinge q. Mede heterogeneidade regional; não é medida de núcleo.'
    en: 'Standard deviation and interquartile range of the 12-month inflation of the 16 IPCA areas, weighted by the official regional weights (IBGE, POF 2017–2018). Weighted quantile: the smallest value whose cumulative weight reaches q. It measures regional heterogeneity; it is not a core measure.'
  arquivo: indicadores/regional_dispersao.csv
- codigo: C.2
  complementar: true
  modulo: a2-3-inflacao
  camada: 1
  estado: publicado
  nome: { pt: 'Contribuição por grupo à diferença regional', en: 'Group contribution to the regional gap' }
  formula: 'c_{a,g,t}=\frac{w_{a,g,t}\,\pi_{a,g,t}-w_{B,g,t}\,\pi_{B,g,t}}{100},\qquad \sum_g c_{a,g,t}=\pi_{a,t}-\pi_{B,t}'
  descricao:
    pt: 'Decompõe a diferença entre a inflação mensal de uma área e a do Brasil nos nove grupos do IPCA, com pesos e variações do mês (SIDRA 7060). A soma iguala a diferença a menos de arredondamento (teste automático). A coluna de 12 meses soma as contribuições mensais: aproximação aditiva, declarada.'
    en: 'Decomposes the gap between an area’s monthly inflation and Brazil’s into the nine IPCA groups, using the month’s weights and changes (SIDRA 7060). The sum equals the gap up to rounding (automatic test). The 12-month column adds the monthly contributions: a declared additive approximation.'
  arquivo: indicadores/regional_contribuicao.csv
- codigo: C.3
  complementar: true
  modulo: a2-3-inflacao
  camada: 1
  estado: publicado
  nome: { pt: 'Classificações e núcleos em 12 meses', en: 'Classifications and cores over 12 months' }
  formula: '\pi^{12}_t=100\left[\prod_{j=0}^{11}\left(1+\frac{\pi_{t-j}}{100}\right)-1\right]'
  descricao:
    pt: 'Composição em 12 meses das séries mensais do BCB: preços livres e administrados, serviços, bens industriais, alimentação no domicílio, comercializáveis e não comercializáveis, e os núcleos de médias aparadas (MA) e percentil 55 (P55), que são calculados pelo BCB. Inclui a média móvel de 12 meses do índice de difusão.'
    en: 'Twelve-month compounding of the BCB monthly series: market and regulated prices, services, industrial goods, food at home, tradables and non-tradables, and the trimmed-mean (MA) and 55th-percentile (P55) cores, which the BCB computes. Includes the 12-month moving average of the diffusion index.'
  arquivo: indicadores/inflacao_classificacoes.csv
