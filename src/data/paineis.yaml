# Painéis do Observatório CEE — Economia Brasileira em Dados (Estatuto, art. 35; Regimento Interno, art. 23).
# Painéis do Observatório por programa (Manual, Parte I, Quadro 1; programas.yaml); cada painel corresponde a uma linha
# com o mesmo código e nome (linhas.yaml). Programas em formação (D, E, F) não têm painel (ADR-017).
# Nenhum painel muda de estado sem evidência no repositório; nenhum slug público muda sem 301.
# `ano` define o ano do plano; contagens e rótulos "Previsto · ano N" do sítio são derivados daqui (ADR-016).
# O painel A2 (Política Monetária) é o Observatório de Política Monetária (edição 2.0; ADR-022), em /observatorio/politica-monetaria/
# (301 a partir de /observatorio/conjuntura/, ADR-026).
# Um painel só passa a "publicado" com dados verificados no catálogo (data/CATALOGO.md),
# edição numerada, metodologia e changelog. Até lá, nenhuma cifra aparece no sítio.
- id: pobreza
  ordem: 1
  area: c
  linha: C1
  estado: em-institucionalizacao
  ano: 1
  titulo:
    pt: Pobreza, Renda e Desigualdade
    en: Poverty, Income and Inequality
  resumo:
    pt: Evolução da pobreza, da renda e da desigualdade no Brasil.
    en: Trends in poverty, income and inequality in Brazil.
  situacao:
    pt: Existe uma versão construída individualmente pelo proponente do CEE. Antes de ser publicada aqui como edição 1, precisa passar pela verificação numérica independente, receber número de edição, nota de mudanças e DOI.
    en: A version built individually by CEE's proposer exists. Before being published here as edition 1, it must pass independent numerical verification and receive an edition number, change log and DOI.
  fontes_previstas: Síntese de Indicadores Sociais (IBGE); PNAD Contínua; CEPAL; Banco Mundial; OCDE
- id: crescimento
  ordem: 2
  area: b
  linha: B1
  estado: em-institucionalizacao
  ano: 1
  titulo:
    pt: Crescimento e Produtividade
    en: Growth and Productivity
  resumo:
    pt: Fontes do crescimento de longo prazo e da produtividade da economia brasileira.
    en: Sources of long-run growth and productivity in the Brazilian economy.
  situacao:
    pt: Painel construído individualmente pelo proponente; falta institucionalizá-lo com versão, DOI e nota de mudanças. Há uma discrepância não reconciliada na decomposição (a soma dos componentes difere do crescimento médio do PIB do mesmo painel), que precisa ser resolvida antes de qualquer publicação.
    en: Panel built individually by the proposer; it still needs a version number, DOI and change log. An unreconciled discrepancy in the decomposition (the components do not add up to the panel's average GDP growth) must be resolved before publication.
  fontes_previstas: Penn World Table 11.0; Contas Nacionais (IBGE); IPCA (BCB/IBGE)
- id: politica-monetaria
  ordem: 3
  area: a
  linha: A2
  estado: publicado
  ano: 1
  versao: "2.0"
  dados_dir: data/processed/opm
  titulo:
    pt: Política Monetária
    en: Monetary Policy
  resumo:
    pt: Observatório de Política Monetária — decisões do Copom, juro real e neutro, inflação e núcleos, expectativas, transmissão, ambiente externo, projeções e moeda.
    en: Monetary Policy Observatory — Copom decisions, real and neutral rates, inflation and core measures, expectations, transmission, external environment, projections and money.
  situacao:
    pt: Edição 2.0 (Observatório de Política Monetária). Camada 1 publicada; camadas 2 e 3 em construção. Atualização automática semanal; cada extração é arquivada com data e hash.
    en: Edition 2.0 (Monetary Policy Observatory). Layer 1 published; layers 2 and 3 under construction. Weekly automated update; every extraction is archived with its date and hash.
  fontes_previstas: BCB (SGS, Focus/Olinda, API de conteúdo do Copom); IBGE (SIDRA); Federal Reserve Board e EIA (via FRED)
  metodologia:
    pt: >-
      Os dados são baixados pelas APIs oficiais (BCB SGS, BCB Olinda/Focus, API de conteúdo e de normativos do BCB,
      IBGE SIDRA e FRED) por scripts em scripts/data/. A resposta bruta de cada requisição é gravada sem alteração em
      data/raw/, com URL, data e hora da extração e hash SHA-256; todas as safras são guardadas (ADR-025). Os códigos e
      nomes oficiais de cada série estão no Catálogo de dados. Os indicadores diretos (camada 1) são calculados em
      scripts/data/derive-opm.ts e os que exigem estimação em analysis/opm (Python, dependências com hash), com saída em
      data/processed/opm/. Juro real pela equação de Fisher exata; Selic esperada composta por dia útil (base 252) com a
      trajetória Focus por reunião. Juro neutro e hiato de juros sempre como faixa, com método e data; o valor do BCB
      aparece ao lado, nunca dentro da distribuição. Dessazonalização (ADR-023): a partir da edição 2.0 o CEE dessazonaliza
      o IPCA, seus grupos e núcleos e os agregados monetários com X-13ARIMA-SEATS 1.1 b62 (especificação por série em
      data/specs/x13/), publicando sempre a série original ao lado da ajustada; IBC-Br e PIB já dessazonalizados pela
      fonte não são reajustados; as revisões são guardadas por safra. A regra da edição 1.0 ("nenhum valor é ajustado
      sazonalmente pelo CEE") está revogada. Validação contra o RPM de setembro de 2026: SAAR de três meses do IPCA e da
      média dos núcleos dentro de 0,5 p.p. em maio e agosto. Fontes com restrição de redistribuição (B3, ANBIMA, J.P. Morgan, Cboe, provedores de CDS e sondagens privadas) ficam fora (ADR-024). O OPM descreve e mede; não recomenda a taxa Selic.
    en: >-
      Data are downloaded from official APIs (BCB SGS, BCB Olinda/Focus, the BCB content and regulations APIs, IBGE
      SIDRA and FRED) by scripts in scripts/data/. Each raw response is stored unchanged in data/raw/ with its URL,
      extraction timestamp and SHA-256 hash; every vintage is kept (ADR-025). Codes and official names are listed in the
      Data catalogue. Direct indicators (layer 1) are computed in scripts/data/derive-opm.ts and those requiring
      estimation in analysis/opm (Python, hashed dependencies), with output in data/processed/opm/. Real rates use the
      exact Fisher equation; the expected Selic is compounded per business day (basis 252) along the Focus path by
      meeting. The neutral rate and the interest-rate gap are always shown as bands, with method and date; the BCB value
      is shown beside, never inside, the distribution. Seasonal adjustment (ADR-023): from edition 2.0 CEE seasonally
      adjusts the IPCA, its groups and core measures and the money aggregates with X-13ARIMA-SEATS 1.1 b62 (per-series
      specification in data/specs/x13/), always publishing the original series beside the adjusted one; the IBC-Br and
      GDP, already adjusted by the source, are not readjusted; revisions are stored by vintage. The edition-1.0 rule
      ("CEE applies no seasonal adjustment") is revoked. Validation against the September 2026 MPR: three-month SAAR of
      the IPCA and the core average within 0.5 p.p. in May and August. Sources with redistribution restrictions (B3, ANBIMA, J.P. Morgan, Cboe, CDS providers and private surveys) are excluded (ADR-024). The OPM describes and measures; it does not recommend
      the Selic rate.
  changelog:
    - versao: "1.0"
      data: 2026-10-20
      nota: Primeira edição. Séries IPCA (SIDRA 1737), meta Selic (SGS 432), desocupação (SIDRA 6381) e expectativas Focus para o IPCA.
    - versao: "2.0"
      data: 2026-11-18
      nota: >-
        Observatório de Política Monetária (ADR-022 a ADR-026). Oito módulos (A2.1–A2.8), 21 indicadores com fórmula
        pública (camada 1 publicada: I.1–I.5, I.7, I.8, I.10, I.18–I.20), dessazonalização própria com X-13, safras em
        tempo real, novo endereço /observatorio/politica-monetaria/ (301 a partir de /observatorio/conjuntura/).
