name: build-deploy

# Publicação na Cloudflare (Workers com arquivos estáticos; wrangler.jsonc; ADR-018).
# Segredos: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (de preferência como segredos do environment
# `cloudflare`, restrito ao branch main). Variável: SITE_URL (ex.: https://cee-site.<conta>.workers.dev).
# Só este job lê os segredos da Cloudflare; data-refresh não os referencia.
on:
  push:
    branches: [main]
  # Commits feitos com GITHUB_TOKEN não disparam `push`; por isso o deploy também roda
  # quando a atualização de dados termina com sucesso.
  workflow_run:
    workflows: [data-refresh]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Conferir variáveis
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Defina a variável SITE_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
      # Sem scripts de instalação (esbuild e workerd funcionam pelos binários opcionais).
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: /
      # Falha o deploy se houver algo interno ou pessoal em dist/.
      - run: npm run qa:seguranca
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          command: deploy
