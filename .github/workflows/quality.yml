name: quality

# Portões de qualidade em cada pull request e push: dependências (npm audit), segredos (gitleaks), tipos, lint,
# testes de dados e de esquema, links internos, nada interno em dist/ (qa:seguranca), acessibilidade (axe, WCAG 2.2 AA)
# e Lighthouse (≥ 95 nas quatro categorias). Actions fixadas por SHA (ADR-018).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # histórico completo
          persist-credentials: false
      # Binário oficial com SHA-256 fixado (sem serviço de licença; nada sai do runner).
      - name: Instalar gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: gitleaks (histórico e diff)
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Sem scripts de instalação. Exceção documentada: o navegador do Playwright é baixado por comando próprio abaixo.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - name: Build (versão preliminar, como publicada)
        run: npm run build
      - run: npm run qa:links
      - name: Nada interno ou pessoal em dist/
        env:
          CEE_NOMES_PROIBIDOS: ${{ secrets.CEE_NOMES_PROIBIDOS }}
        run: npm run qa:seguranca
      - name: Acessibilidade (axe) em todas as páginas
        run: |
          npx astro preview --port 4321 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          node scripts/qa/axe.mjs http://localhost:4321
          kill %1
      - name: Lighthouse (build com CEE_LANCADO=1 para medir SEO sem o noindex preliminar)
        run: |
          CEE_LANCADO=1 npm run build
          npx astro preview --port 4321 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          node scripts/qa/lighthouse.mjs http://localhost:4321 lighthouse-report
          kill %1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: lighthouse-report
