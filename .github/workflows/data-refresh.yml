name: data-refresh

# Atualização semanal às segundas, 12:30 UTC (9:30 em Brasília), logo após a divulgação do
# boletim Focus (8:25). Vintages idênticos ao anterior não são gravados; só publica se algum
# dado mudou. Também pode ser disparada à mão (Actions → data-refresh → Run workflow).
on:
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

# Único workflow com escrita; não referencia os segredos da Cloudflare (ADR-018).
permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Python do OPM (ADR-022/023): python3 do runner, dependências só com hash; o binário X-13 é baixado
      # em versão fixa e conferido por SHA-256 dentro de analysis/opm/x13.py.
      - run: python3 -m venv .venv && .venv/bin/pip install --require-hashes -r analysis/requirements.txt
      # Extração: se uma fonte falhar, o vintage anterior é mantido e a falha registrada (não quebra).
      - run: npm run data:fetch
      - run: npm run data:process
      - run: npm run data:derive
      - run: npm run data:dessaz
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npm run data:opm
      - run: npm run data:inflacao
      - run: npm run data:neutro
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npm run data:catalogo
      # Testes de formato, intervalos, duplicatas, integridade e referência: se falharem, nada é publicado.
      - run: npm test
      - run: npm run test:py
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
      - name: Commit do novo vintage
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "cee-dados[bot]"
          git config user.email "cee-dados[bot]@users.noreply.github.com"
          git add data
          git commit -m "Dados: vintage de $(date -u +%Y-%m-%d)"
          git push
