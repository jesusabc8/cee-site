name: data-refresh

# Atualização semanal dos dados do Observatório (terças, 13:00 UTC = 10:00 em Brasília,
# depois da divulgação do Focus de segunda-feira). Também pode ser disparada à mão.
on:
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Extração: se uma fonte falhar, o vintage anterior é mantido e a falha registrada (não quebra).
      - run: npm run data:fetch
      - run: npm run data:process
      - run: npm run data:catalogo
      # Testes de formato, intervalos, duplicatas e integridade: se falharem, nada é publicado.
      - run: npm test
      - name: Commit do novo vintage
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git config user.name "cee-dados[bot]"
          git config user.email "cee-dados[bot]@users.noreply.github.com"
          git add data
          git commit -m "Dados: vintage de $(date -u +%Y-%m-%d)"
          git push
