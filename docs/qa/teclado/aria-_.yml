  - region "Aprenda a fazer pesquisa econômica fazendo pesquisa econômica.":
    - paragraph: Participe
    - heading "Aprenda a fazer pesquisa econômica fazendo pesquisa econômica." [level=2]
    - paragraph: Entrada aberta a estudantes de Ciências Econômicas de qualquer campus e do EAD. A responsabilidade cresce com a qualidade demonstrada, segundo critérios escritos e públicos.
    - link "Como participar":
      - /url: /participe/
    - list:
      - listitem: Entrada aberta Sem seleção enquanto houver mais trabalho do que gente. Cada pessoa começa com uma tarefa pequena e real.
      - listitem: Mérito progressivo De Participante a Coordenador de Área, com critérios escritos. O mérito vale para progredir e assinar, não para entrar.
      - listitem: "Formação em método Oito sessões por semestre: fontes de dados, fluxo reproduzível, controle de versão, microdados da PNAD, desenho de pesquisa, contabilidade do crescimento, redação técnica e visualização honesta."
