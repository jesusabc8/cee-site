        - paragraph: Quem se beneficia do crescimento, e por que a informalidade persiste?
  - region "Participe":
    - heading "Participe" [level=2]
    - paragraph: A entrada é aberta a estudantes de Ciências Econômicas de qualquer campus e do EAD, sem seleção e sem pré-requisito. Cada pessoa começa com uma tarefa real e revisada.
