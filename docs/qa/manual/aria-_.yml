- main:
  - heading "Centro de Estudos Econômicos" [level=1]
  - paragraph: Análise econômica empírica sobre o Brasil, rigorosa, reprodutível e de acesso aberto — e a formação de estudantes de graduação nesse padrão.
  - paragraph:
    - text: Nenhum número é publicado sem que outra pessoa reexecute o código e chegue ao mesmo resultado.
    - link "Como trabalhamos":
      - /url: /metodologia/
  - region "Última publicação":
    - heading "Última publicação" [level=2]
    - paragraph: A primeira publicação do CEE está em preparação. Quando sair, aparecerá aqui, com dados, código e bloco de citação.
  - region "Observatório de Dados":
    - heading "Observatório de Dados" [level=2]
    - link "Ir para o Observatório":
      - /url: /observatorio/
    - paragraph: Séries econômicas brasileiras em formato limpo e versionado, com fonte, código da série e data de extração em cada gráfico.
    - figure "Inflação em 12 meses e meta da taxa Selic":
      - heading "Inflação em 12 meses e meta da taxa Selic" [level=3]
      - paragraph: Em set. de 2026, o IPCA acumulado em 12 meses foi de 4,58%. Em 20 de out. de 2026, a meta Selic definida pelo Copom era de 13,75% ao ano.
      - paragraph: "Unidade: % (IPCA: acumulado em 12 meses; Selic: % ao ano, valor no fim do mês)"
      - list "Legenda":
        - listitem: IPCA 12 meses
        - listitem: Meta Selic
      - group "Período":
