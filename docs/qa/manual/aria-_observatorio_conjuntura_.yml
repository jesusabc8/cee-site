    - heading "Taxa de desocupação (PNAD Contínua)" [level=2]
    - paragraph: "No trimestre móvel encerrado em ago. de 2026, a taxa de desocupação foi de 5,3% (intervalo aproximado de 95%: 5,2%–5,4%)."
    - paragraph: "Unidade: % da força de trabalho de 14 anos ou mais, trimestre móvel, sem ajuste sazonal"
    - group "Período":
