  - figure "Inflação em 12 meses e meta da taxa Selic":
    - heading "Inflação em 12 meses e meta da taxa Selic" [level=2]
    - paragraph: Em set. de 2026, o IPCA acumulado em 12 meses foi de 4,58%. Em 20 de out. de 2026, a meta Selic definida pelo Copom era de 13,75% ao ano.
    - paragraph: "Unidade: % (IPCA: acumulado em 12 meses; Selic: % ao ano, valor no fim do mês)"
    - list "Legenda":
      - listitem: IPCA 12 meses
