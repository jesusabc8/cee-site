  - heading "Conjuntura — inflação, juros, expectativas e desocupação" [level=1]
  - paragraph: Séries de conjuntura extraídas diretamente das APIs oficiais do IBGE e do Banco Central do Brasil, com data de extração, vintages arquivados e verificação automática a cada atualização.
