      - radio "Desde 2012"
      - text: Desde 2012
    - paragraph: "Gráfico de linhas com duas séries mensais desde jan. de 2012: IPCA acumulado em 12 meses e meta Selic. Últimos valores: IPCA 4,58% (set. de 2026); Selic 13,75% (20 de out. de 2026). Os dados completos estão na tabela abaixo."
    - strong: "Fonte:"
    - link "IBGE":
      - /url: https://sidra.ibge.gov.br/tabela/1737
    - text: ","
    - code: SIDRA 1737, variáveis 63 e 2265 (Brasil)
