    - strong: "Fonte:"
    - link "IBGE":
      - /url: https://sidra.ibge.gov.br/tabela/6381
    - text: ","
    - code: SIDRA 6381, variáveis 4099 e 4103 (Brasil)
    - text: ; extração em
    - time: 20 de out. de 2026
    - text: ". Faixa sombreada: taxa × (1 ± 1,96 × coeficiente de variação), aproximação normal calculada pelo CEE a partir do CV publicado pelo IBGE (variável 4103). A série não tem ajuste sazonal: compare com o mesmo trimestre móvel de anos anteriores."
