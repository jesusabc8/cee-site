    - text: ","
    - code: SGS 432
    - text: ; extração em
    - time: 20 de out. de 2026
    - text: . A meta Selic é uma série diária; o gráfico mostra o valor vigente no último dia disponível de cada mês. As duas séries são conceitos distintos (inflação passada em 12 meses e taxa nominal de política) e a diferença entre elas não é uma taxa de juros real.
